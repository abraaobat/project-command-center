name: KES manifest validation

on:
  push:
    paths:
      - "docs/knowledge-extraction/**"
      - "scripts/validate_kes_manifests.py"
      - ".github/workflows/validate-kes.yml"
  pull_request:
    paths:
      - "docs/knowledge-extraction/**"
      - "scripts/validate_kes_manifests.py"
      - ".github/workflows/validate-kes.yml"

permissions:
  contents: read

jobs:
  validate-kes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'jsonschema[format]>=4.23,<5'
      - run: python scripts/validate_kes_manifests.py
